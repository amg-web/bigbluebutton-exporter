services:
  node_exporter:
    container_name: node_exporter
    # Always check if there is a newer stable release:
    # https://hub.docker.com/r/prom/node-exporter/tags
    image: prom/node-exporter:latest
    command:
    - "--path.rootfs=/host"
    - "--web.listen-address=127.0.0.1:9100"
    - "--collector.filesystem.mount-points-exclude=^/(dev|boot|run|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)"
    network_mode: "host"
    pid: "host"
    volumes:
    - type: "bind"
      source: "/"
      target: "/host"
      read_only: true
    restart: unless-stopped
